name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure google-services.json for CI
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "123456789012",
                "project_id": "vin-music-ci",
                "storage_bucket": "vin-music-ci.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                    "android_client_info": {
                      "package_name": "com.vinmusic"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "fake_api_key_for_ci_build"
                    }
                  ],
                  "services": {
                    "analytics_service": {
                      "status": 1
                    },
                    "appinvite_service": {
                      "status": 1,
                      "other_platform_oauth_client": []
                    },
                    "ads_service": {
                      "status": 1
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
            EOF
          fi

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
